name: Linux port

# (linux port) Game-free checks of the Linux build: the Win32 stand-ins run, the host runtime and the Vulkan back end
# compile with the flags nx2/build.py uses. docs/linux.md.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the toolchain and headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libvulkan-dev spirv-headers \
            libavcodec-dev libswscale-dev libswresample-dev libavutil-dev
          git clone --depth 1 https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator "$RUNNER_TEMP/vma"
          echo "RX_VMA=$RUNNER_TEMP/vma" >> "$GITHUB_ENV"
      - name: Win32 stand-ins (run)
        run: |
          clang -O1 -D_GNU_SOURCE -rdynamic -Ihost tests/win32_compat_test.c host/plat_posix.c -lpthread -ldl -o "$RUNNER_TEMP/w32t"
          "$RUNNER_TEMP/w32t"
      - name: Host runtime (compile)
        run: python3 -I scripts/linux_check.py
      - name: Vulkan back end (compile)
        run: python3 -I scripts/linux_check.py --vk --jobs 4
      - name: Builder tests
        run: |
          python3 -I -B tests/test_make_game_cache.py
          python3 -I -B tests/test_cpp_preflight.py --cxx clang++
